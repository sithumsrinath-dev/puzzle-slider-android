name: Build Puzzle Slider AAB

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 60

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Free Disk Space on GitHub Runner
      run: |
        sudo rm -rf /usr/share/dotnet
        sudo rm -rf /usr/local/lib/android
        sudo rm -rf /opt/ghc
        sudo rm -rf /usr/local/share/boost
        sudo docker image prune --all --force
        sudo apt-get clean
        df -h

    - name: Set up Swap Space
      uses: pierotofy/set-swap-space@master
      with:
        swap-size-gb: 10

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Set up Java 17
      uses: actions/setup-java@v5
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Install System Dependencies
      run: |
        sudo apt-get update -o Acquire::Retries=3
        sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
          ccache \
          cmake \
          ninja-build \
          zip \
          unzip \
          autoconf \
          libtool \
          pkg-config \
          zlib1g-dev \
          libncurses5-dev \
          libncursesw5-dev \
          libffi-dev \
          libssl-dev

    - name: Upgrade Pip and Core Tooling
      run: |
        python -m pip install --upgrade pip setuptools wheel

    - name: Install Cython (Isolated Step)
      run: |
        python -m pip install --no-cache-dir "cython<3.0.0"

    - name: Install Buildozer and Kivy Dependencies
      run: |
        python -m pip install --no-cache-dir virtualenv buildozer kivy

    - name: Validate Repository Buildozer Spec
      run: |
        if [ ! -f buildozer.spec ]; then
          echo "Error: buildozer.spec not found in repository root!"
          exit 1
        fi
        echo "buildozer.spec verified successfully."

    - name: Build Android APK with Buildozer
      run: |
        unset ANDROID_SDK_ROOT
        unset ANDROID_HOME
        unset ANDROID_NDK
        unset ANDROID_NDK_LATEST_HOME
        unset ANDROID_NDK_HOME
        unset ANDROID_NDK_ROOT
        
        export HOME=/home/runner
        export BUILDOZER_ALLOW_ORG_TEST_DOMAIN=1
        export ACCEPT_SDK_LICENSE=1

        yes | buildozer -v android debug
      env:
        MAKEFLAGS: "-j2"
        GRADLE_OPTS: "-Xmx2048m -XX:MaxMetaspaceSize=512m -Dorg.gradle.parallel=false"

    - name: Upload Build Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: debug-apk
        path: bin/*.apk
